[Debug]
; Hold-fire protection. Set 0 only for a control test. Restart required.
EnableHoldFire=1
; Per-shot timing/counters and native_metrics.csv.
EnableMetrics=0
; Game-thread tick intervals in engine_frames.csv. Also enables metrics.
CaptureEngineFrames=0

; Diagnostic raw relationship and withheld-value counters. Also enables metrics.
CaptureRelationships=0
